[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "movie-mind"
version = "4.0.0"
description = "Conversational movie recommender with semantic search, hybrid ranking, LLM explanations, and streaming availability"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # -----------------------------------------------------
    # Core ML / NLP
    # -----------------------------------------------------
    "torch @ https://download.pytorch.org/whl/cpu/torch-2.5.1%2Bcpu-cp311-cp311-linux_x86_64.whl",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",

    # -----------------------------------------------------
    # API / Backend
    # -----------------------------------------------------
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",

    # -----------------------------------------------------
    # Frontend
    # -----------------------------------------------------
    "streamlit>=1.45.0",
    "plotly>=5.24.0",
    "requests>=2.32.0",

    # -----------------------------------------------------
    # LLM / Env
    # -----------------------------------------------------
    "groq>=0.18.0",
    "python-dotenv>=1.0.1",

    # -----------------------------------------------------
    # Streaming Providers
    # -----------------------------------------------------
    "simple-justwatch-python-api>=1.0.0",

    # -----------------------------------------------------
    # Optional HF utilities
    # -----------------------------------------------------
    "huggingface_hub>=0.30.0",

    # -----------------------------------------------------
    # Performance
    # -----------------------------------------------------
    "orjson>=3.10.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.28.0",
    "ruff>=0.11.0",
]

# ---------------------------------------------------------
# UV
# ---------------------------------------------------------
[tool.uv]
index-strategy = "unsafe-best-match"

# ---------------------------------------------------------
# Ruff
# ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

# ---------------------------------------------------------
# Pytest
# ---------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]